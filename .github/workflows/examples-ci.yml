name: examples-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
        working-directory: examples
      - name: Analyze
        run: dart analyze
        working-directory: examples
      - name: Test
        run: dart test
        working-directory: examples
