<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bulls-eye architecture</title>
<script src="vendor/viz-standalone.js"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#ffffff}</style>
</head>
<body>
<script>
// Source: book/diagrams/src/bulls-eye.dot — edit the DOT, keep the renderer in sync.
const dot = `digraph BullsEye {
  rankdir=TB;
  compound=true;
  fontname="Helvetica";
  node [shape=box, style="rounded,filled", fontname="Helvetica", fontsize=13, color="#334155"];
  edge [color="#64748b", arrowhead=vee];

  subgraph cluster_ui {
    label="UI / Presentation (Flutter) — exceptions live here, and only here";
    style="rounded,filled"; fillcolor="#e2e8f0"; color="#64748b"; fontcolor="#0f172a";
    ui [label="Widgets, providers, composition root", fillcolor="#f8fafc", style="rounded,filled"];

    subgraph cluster_app {
      label="Application / Use Cases — orchestration, no I/O, no Flutter";
      style="rounded,filled"; fillcolor="#dbeafe"; color="#3b82f6"; fontcolor="#1e3a8a";
      uc [label="Use cases, repository contracts", fillcolor="#eff6ff", style="rounded,filled"];

      subgraph cluster_domain {
        label="Domain — THE CENTER: pure Dart, no I/O, equatable + fpdart only";
        style="rounded,filled"; fillcolor="#dcfce7"; color="#16a34a"; fontcolor="#14532d";
        domain [label="Entities, value objects, failures", fillcolor="#f0fdf4", style="rounded,filled"];
      }
    }
  }
  adapters [label="Datasource adapters live outside\n(drift/sqlite, sembast, http, in-memory)", shape=box, style="rounded,dashed,filled", fillcolor="#fef3c7", color="#d97706", fontcolor="#78350f"];
  ui -> adapters [style=dashed, constraint=false];
  ui -> uc [style=invis];
  uc -> domain [style=invis];
}`;
(async () => {
  try {
    const viz = await Viz.instance();
    const res = viz.render(dot, { format: "svg" });
    if (res.status === "success") {
      document.body.innerHTML = res.output;
      window.__renderOk = true;
    } else {
      window.__renderErr = JSON.stringify(res.errors);
    }
  } catch (e) {
    window.__renderErr = String(e);
  }
})();
</script>
</body>
</html>
